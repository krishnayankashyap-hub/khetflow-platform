name: KhetFlow Monorepo CI

on:
  push:
    branches: [ main, portals ]
  pull_request:
    branches: [ main, portals ]

jobs:
  build-and-verify:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm ci || npm install
          cd farmer-portal && (npm ci || npm install) && cd ..
          cd business-portal && (npm ci || npm install) && cd ..
          cd rider-portal && (npm ci || npm install) && cd ..

      - name: Build All Portals
        run: npm run build:all
